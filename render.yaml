services:
  - type: web
    name: studyflow-ai
    runtime: node
    buildCommand: npm ci --prefix client && npm run build --prefix client && npm ci --prefix server --omit=dev
    startCommand: node server/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
